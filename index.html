<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Household Tracker for Nalini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .home-wrap { text-align: center; padding: 40px 24px; }
    .home-icon { font-size: 4rem; margin-bottom: 20px; }
    h1 { font-family: var(--font-display); font-size: 2.2rem; margin-bottom: 8px; }
    h1 span { color: var(--accent); font-style: italic; }
    p { color: var(--text-muted); margin-bottom: 32px; font-size: 0.95rem; }
    .people-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 28px; }
    .person-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 20px;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      font-family: var(--font-body);
    }
    .person-btn:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: var(--accent); }
    .admin-link { font-size: 0.82rem; color: var(--text-light); }
    .admin-link a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="home-wrap">
    <div class="home-icon">🏠</div>
    <h1>Household <span>Tracker</span></h1>
    <p>Select your name to view your tasks for today.</p>
    <div class="people-grid" id="people-grid">
      <div class="loading-state"><span class="spinner"></span></div>
    </div>
    <div class="admin-link">Owner? <a href="/admin">Go to Admin Dashboard →</a></div>
  </div>

  <!-- ENV injection: Vercel injects these at build time or via edge config -->
  
  <script type="module">
    import { getPeople } from '/js/supabase.js';
    const grid = document.getElementById('people-grid');
    const colors = {
      dass:'#E07B54', karthiga:'#7B9E87', selvi:'#C4A882',
      ajitha:'#8B7BAB', amma:'#D4849A', appa:'#5B8FA8'
    };
    try {
      const people = await getPeople();
      grid.innerHTML = people.map(p => `
        <a class="person-btn" href="/person?person=${p.id}"
           style="border-color:${p.color}22">
          <span style="font-size:1.4rem">${p.emoji}</span>
          ${p.name}
        </a>`).join('');
    } catch(e) {
      grid.innerHTML = `<p style="color:var(--danger)">Failed to load. Check your Supabase config.</p>`;
    }
  </script>
</body>
</html>
